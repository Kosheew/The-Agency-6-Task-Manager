# Agency — Game Design Document

## 1. Бачення

**Agency** — ізометричний кіберпанк-детектив про агента, чия психологічна й фізична форма так само важлива, як куля чи аргумент: кожне рішення має ціну в здоров'ї, витривалості та стресі.

| Параметр | Значення |
| --- | --- |
| Жанр | Top-down shooter, story-driven immersive sim, sandbox |
| Рушій / платформа | Unity HDRP, PC |
| Візуал | Ретро-кіберпанк кінця 80-х — початку 90-х, напівреалізм |
| Головний референс | Disco Elysium (структура діалогового вікна, інвентар, докази) |
| Інші референси | Condemned (предмети розслідування), Splinter Cell: Chaos Theory (злам), Cyberpunk 2077 (автомати), RDR2 (карма) |

### Стовпи дизайну

1. **Ціна рішення.** Будь-яка дія (діалог, постріл, використання предмета, злам) змінює ресурси й світ.
2. **Невидима механіка.** Гравець бачить наслідки (тремтіння, галюцинації, зміни реплік), а не цифри.
3. **Три шляхи — одна гра.** Бій, дипломатія, аналіз: жоден не є «правильним», кожен має плюси й мінуси.
4. **Світ реагує.** NPC пам'ятають, квести й репутація залежать від вибору, руйнування й стелс мають наслідки.
5. **Простота перед глибиною.** Там, де система загрожує переускладненням, обираємо унікальні репліки замість нових підсистем.

## 2. Ігровий цикл

> **Статус:** чернетка v1 від 19.11.2026. Сторінка «Game Cycle» у вихідній доці порожня, тому цикл складено з нотаток і з аналізу поточного стану проєкту (сцени, префаби, конфіги). Скоуп вертикального зрізу і склад локацій — **пропозиція**, їх потрібно погодити (список у кінці розділу, задача AG-001).

### Макроцикл: від хабу до хабу

Одна **справа** — це повний прохід: гравець бере справу в хабі, їде на локації, розслідує, говорить, вирішує конфлікти й повертається в хаб, де бачить наслідки.

| № | Етап | Що робить гравець | Системи | Стан у проєкті |
| --- | --- | --- | --- | --- |
| 1 | **Хаб (офіс Agency)** | Отримує справу від куратора, купує предмети в автоматі, відновлює стрес, налаштовує зброю | Діалоги, квести, економіка, інвентар | Автомат, діалоги і квести є; **хаб-сцени немає** |
| 2 | **Подорож** | Виходить із хабу на локацію через двері чи вихід; вхід у зону запускає квест або діалог | `LocationService`, завантаження сцен | Каркас є, **конфігів локацій і викликів немає** |
| 3 | **Розслідування** | Збирає докази, читає досьє, відкриває замки інструментом | Докази, лут, предмети розслідування | 3 тестові докази, екран доказів; замків немає |
| 4 | **Діалог** | Допитує й домовляється; варіанти залежать від доказів, психотипу й ресурсів | `DialogueModule`, психотип | Одна тестова гілка (автомат), без психотипів |
| 5 | **Конфлікт** | Проходить стелсом або б'ється; провал стелсу вмикає бій | Зір, шум, укриття, зброя | Системи є, **сценарної ділянки немає** |
| 6 | **Наслідки** | Бачить зміни HP, витривалості, стресу, нагороди, докази, гілки сюжету | Ресурси, квести, економіка | Окремого екрана і нагород немає |
| 7 | **Повернення в хаб** | Закриває справу, продає, відновлюється, бере нову | Збереження, квести | Збереження й слоти є; хабу немає |

### Мікроцикл у локації

Бар'єр → вибір підходу (сила, слово, аналіз, стелс) → ціна ресурсів → результат → нова зона або гілка.

**Три підходи до одного бар'єру** — основне правило дизайну: кожен бар'єр має щонайменше два способи пройти.

| Підхід | Як проходить | Ціна |
| --- | --- | --- |
| Сила | Бій або залякування | HP, витривалість, шум → тривога |
| Слово | Діалог, переговори | Стрес, репутація |
| Аналіз | Докази, інструмент, злам | Час, предмет, інколи стрес |
| Стелс | Обхід, відволікання | Витривалість, ризик провалу |

### Правила циклу

1. **Хаб безпечний:** без бою; стрес відновлюється тільки тут.
2. **Справа закривається лише в хабі:** наслідки гравець бачить після повернення.
3. **Нічого не губиться між входами:** лут, докази, діалоги й квести зберігаються (уже реалізовано), позиція в локації запам'ятовується.
4. **Автозбереження** — при вході в хаб і при вході в локацію; ручне й слоти — з меню.
5. **Без софтлоків:** кожен замок має другий шлях, кожен діалог має вихід.

### Вертикальний зріз: справа «Таємничий інформатор»

| Параметр | Значення |
| --- | --- |
| Тривалість | 30–45 хвилин |
| Справ | 1 |
| Локацій | хаб + 2 основні (+ 1 опційна, якщо вкладаємось) |
| Підходи до ключової сцени | 3: залякування / переговори / докази |
| Стелс-ділянка | 1 |
| Докази | 5 і більше (3 обов'язкові для фіналу) |
| Зброя й предмети | Tactical Pistol, Rifle, M18, аптечка, інструмент розслідування (усе вже є) |
| Кінцівки | 2 |
| Вимога | Проходиться кожним психотипом, без софтлоків, зі збереженням посередині |

**Хід справи (орієнтовний хронометраж):**

1. **Хаб, 3–5 хв.** Брифінг у куратора, автомат, видача квесту «Таємничий інформатор».
2. **Локація A «Станція», 12–15 хв.** Розслідування: три докази, свідок-цивільний (діалог із залежністю від доказів і психотипу), замок, який відкривається інструментом, або обхід.
3. **Локація B «Технічні рівні», 10–15 хв.** Стелс-ділянка з охороною (бій як запасний шлях), потім ключова розмова з інформатором: залякування, переговори або докази.
4. **Наслідки й хаб, 3–5 хв.** Екран підсумку, нагороди, одна з двох кінцівок.

**Локації зрізу (пропозиція):**

| Локація | Роль у справі | Сцена в проєкті | Що вже є | Чого бракує |
| --- | --- | --- | --- | --- |
| Хаб «Офіс Agency» | Брифінг, торгівля, відновлення | **нова** | `VendingMachine`, діалоги, моделі дверей (`Models/Agency`) | Сцена, куратор, виходи на локації |
| A «Станція» | Розслідування і свідок | `StationScene` | 3 об'єкти лута (докази, 2 гвинтівки), спавнери ворога / цивільного / «розмова перед боєм» | Діалог свідка, 3 докази квесту, замок, маркери |
| B «Технічні рівні» | Стелс, конфлікт, фінальна розмова | `GameplayScene` (пісочниця) або нова | Спавнери гравця й ворогів, лут (M18, гвинтівка, пістолет, докази), автомат, зона кроку квесту | Прибрати тестові об'єкти, патрулі, укриття, інформатор |
| C «Склад» (опційна) | Додатковий бій / лут | немає | — | Тільки якщо A і B готові раніше за термін |

| № | Прогалина | Чим це б'є по зрізу |

### Рішення на погодження (AG-001)

- [ ] Макроцикл і мікроцикл підтверджені
- [ ] Скоуп: одна справа, хаб + 2 локації, 30–45 хвилин
- [ ] Склад локацій: хаб (нова), A = `StationScene`, B = `GameplayScene` / нова
- [ ] Справа «Таємничий інформатор» лишається назвою зрізу
- [ ] Опційну локацію C беремо лише за запасом часу

## 3. Ресурси гравця

Трикомпонентна система: здоров'я — виживання, витривалість — дії, стрес — накопичуваний дебаф. У коді вже є `Health`, `Endurance`, `Stress` (`PlayerStatsService`, `MonoBoundedStat`); нижче — цільові правила.

| Ресурс | Макс. | Автовідновлення / ріст | Умова | Нуль / максимум |
| --- | --- | --- | --- | --- |
| Здоров'я | 100 | +3 за 60 с (відпочинок, 100 HP ≈ 30 хв) | витривалість ≥ 60% | 0 = смерть |
| Витривалість | 100 | +4 за 60 с; у бою автовідновлення вимкнене | — | 0 = неможливо діяти, ріст стресу |
| Стрес | 100 | не знижується сам; +2 за хв лише за умов | витривалість < 15% або бій (+6 за хв) | 100 = криза |

### Взаємозв'язки

- **Низьке HP (< 50%):** відновлення витривалості ×0.5, накопичення стресу +20%; в бою більший розкид.
- **Низька витривалість:** < 10% — урон по гравцю +25%, стрес у бою ×3; 0 — «перевтома», HP не відновлюється; біг неможливий.
- **Високий стрес (> 70%):** відновлення HP і витривалості уповільнюється, вартість фізичних дій +30%, розкид +30%, тремтіння, галюцинації, обмеження діалогів.
- **Криза:** стрес 100 + низьке HP — втрата контролю, альтернативні кінцівки.
- **Зворотні зв'язки:** стимулятори відновлюють витривалість, але додають стрес; відпочинок лікує, але на стресових локаціях додає стрес.

### Імерсія

Ресурси не показуються числами: кров на екрані та хромання (HP), важке дихання й розмиті краї (витривалість), тремтіння камери, галюцинації, шепіт (стрес).

### Формула ціни рішення

Базова вартість множиться на коефіцієнт зміни у відсотках; застосовується до ресурсів і до характеристик предметів.

<div class="formula">K = <span class="frac"><span>100 + p</span><span>100</span></span></div>

де p — зміна у %: −30 → K = 0.7 (дешевше), +30% → K = 1.3 (дорожче). Одночасні модифікатори множаться (психотип × стан × модуль).

## 4. Психотипи

Гравець обирає психотип на початку; він змінює стиль гри, унікальні репліки в ключових моментах (1–2 на подію) і модифікатори ресурсів. У коді: `PersonalityType` (Daredevil, Individualist, Encyclopedia) і `PsychotypeService` — наразі лише лічильник очок.

| Психотип | Роль | Сильна сторона | Слабка сторона |
| --- | --- | --- | --- |
| Гаряча голова (Сміливець) | Бойова, динаміка | Витривалий у діях, залякування | Стрес накопичується швидше, ризик бою в діалогах |
| Індивідуаліст | Збалансована (базова гра) | Харизма: стрес відновлюється після успішних діалогів | Провал діалогу безпосередньо більше стресу |
| Енциклопедія | Дослідницька, аналіз | Стійкий до стресу в інтелектуальних задачах | Слабка витривалість |

### Числові модифікатори (%, від бази)

| Аспект | Гаряча голова | Індивідуаліст | Енциклопедія |
| --- | --- | --- | --- |
| Стрес ПВ | −20 | +10 | +35 |
| Стрес ШН | +15 | 0 | 0 |
| Стрес ДД | +40 | +10 | −40 |
| Стрес БД | 0 | +15 | 0 |
| Витривалість ПВ | +15 | 0 | −10 |
| Витривалість ШН | +10 | 0 | −20 |
| Витривалість ДД | −20 | 0 | +20 |
| Здоров'я ПВ | +10 | 0 | −20 |
| Здоров'я ШН | +10 | 0 | 0 |
| Здоров'я ДД | +10 | 0 | 0 |

Розшифровка скорочень (підтверджено автором): **ПВ** — початкова величина; **ШН** — швидкість накопичення (відновлення, зменшення); **ДД** — дебаф від дій (більше шкоди від зовнішніх факторів); **БД** — бонус від дій (більше користі від зовнішніх факторів). Значення — відсотки зміни від базового.

### Рішення по зброї, розслідуванню та техніці

- **Зброя:** числові штрафи психотипу в бою відхилено (Гаряча голова залишається найсильнішою). Замість — **спорідненість до класу зброї**: Гаряча голова — ближня дистанція (пістолети, дробовики); Індивідуаліст — середня (карабіни, штурмові гвинтівки); Енциклопедія — дальня і пістолет (пістолет, снайперські). Ризик: скудний арсенал — потрібно мінімум по 2 стволи на клас.
- **Розслідування:** психотип не впливає на швидкість чи точність виявлення зачіпок (щоб не відрізати контент). Тільки унікальні фрази.
- **Технічні дії:** маленький перк — Гаряча голова швидше (−10% часу, +20% витрати), Енциклопедія повільніше (+25% часу, +5% витрати), Індивідуаліст без змін. Реалізуємо, якщо це нескладно.
- **Немає «кращого» психотипу:** кожен сяє в своїх ситуаціях (загадки — Енциклопедія, бій — Гаряча голова, переговори — Індивідуаліст).

### Розширення: легкий RPG-шар (пропозиція, не в вихідній доці)

Рольової системи з параметрами персонажа в доці немає, тому база для ймовірностей в діалогах невизначена. Для «Діско-подібного» відчуття пропонуємо мінімальний шар:

- 3 навики на психотип (наприклад, у Енциклопедії: логіка, спостережливість, техніка), рівні 0–5, ростуть за виконані кроки квестів та докази.
- Перевірки детерміновані: рівень навику + бонус доказів ≥ поріг, без RNG; ресурси (стрес > 70) лише блокують або змушують варіант.
- Деталі та план реалізації — у `Docs/ROADMAP_RPG.md` у репозиторії гри.

## 5. Діалоги та ціна рішень

Діалог — головний інструмент детектива і найбільш важлива система для допрацювання до 100%. Відповідність коду — у колонці «Стан».

| Механіка | Вимога | Стан |
| --- | --- | --- |
| Вибір відповіді | Остання репліка NPC над варіантами; підсвітка й збільшення тексту при наведенні; гілки та повернення до головного сюжету | Діалогові гілки і вузли є; підсвітка/анімація — перевірити |
| Пам'ять | Прокрутка всіх попередніх реплік; обрані відповіді залишаються лише в одному екземплярі; завершений діалог позначається завершеним | `DialogueHistoryEntry`, `EntityDialogueSaveData` |
| Тригери | Варіант запускає подію в світі (відкриття дверей) | `DialogueOption.GameEvents` |
| Контекстні відповіді | Заблокований варіант показує «Невідомо», доступний — справжній текст; умова — зачіпки (предмети, факти) щодо NPC | `RequiredEvidence`, `PersonalityType` у варіанті |
| Досьє | Клік на портреті відкриває вікно персонажа зі зібраною інформацією | Не реалізовано (є `EvidenceScreen`) |
| Аудіо | Аудіо вибору гравця, потім відповідь NPC | `VoiceActingClip` є |
| Анімація друку | Новий текст з'являється ефектом друку | `DialogueTypingEffect` є — перевірити |
| Перевикористання | NPC має сотні діалогів у різні періоди; розробник керує, який діалог завантажено | `DialogueBranchService`, `DialogueBranchChanger` |

### Вплив ресурсів на діалоги

- Варіанти мають поле «вплив на ресурс» (HP, витривалість, стрес) і поріг доступності.
- При стресі > 70% в ключових діалогах 2–3 репліки примусово обираються за гравця (гірший результат); низьке HP блокує фізичні варіанти («залякати»).
- Для кожного ключового вибору: 3–4 опції (по одній на психотип) + нейтральна (безпечна, менш ефективна, завжди доступна).
- NPC можуть мати такі ж ресурси (стрес під час допиту, стимулятори): тактичний важіль. Ризик надмірного ускладнення — вводити лише для ключових допитів.

### Вплив предметів на діалоги

| Тип | В діалозі | Умови | Вартість |
| --- | --- | --- | --- |
| Бойові | Агресивна/залякувальна опція | У інвентарі; HP > 30; витривалість > 15 | Витривалість предмета −3–5, стрес +5 |
| Медичні | Дипломатична/довіра | HP < 80; стрес < 50 | Витрата предмета 2, HP +20 |
| Доступу | Переконання/прохід | Витривалість > 40; є бар'єр у сцені | Довговічність −1, стрес +2 |
| Сюжетні / докази | Ключові викривальні опції | Зачіпка активна; стрес < 60 | Одноразове; витривалість −2 |
| Атмосферні | Соціальні/емоційні опції | Стрес < 40; доречна ситуація | Довговічність −1, витривалість −1 |

Розслідувальні та технічні предмети у діалогах не застосовуються.

### Ймовірність успіху — відкрите питання

Автор підкреслив, що без рольової системи неясно, від чого рахувати ймовірність, і не хоче звичного RNG. Рекомендація: детерміновані бар'єри — варіант доступний, якщо виконано умови (докази, предмет, поріг ресурсу), а «провал» виникає з порогів (стрес > 70 змушує агресивну репліку). Рандом — лише для окремих ризикованих варіантів (наприклад, стрес > 70 → 50% шансу бою).

## 6. Предмети, руки, інвентар, зброя

Дев'ять типів предметів; використання кожного має ціну в ресурсах та витривалості (`DurabilityCostPerUse`, `EnduranceCostPerUse`).

| Тип | Роль | Приклади |
| --- | --- | --- |
| Зброя | Пряма конфронтація, вибір «шум проти тиші» | Пістолет, гвинтівка, ніж |
| Модулі | Модернізація зброї | Глушник, приціл |
| Тактичні | Витратні бойові | Граната, димова шашка |
| Медичні | Відновлення | Аптечки, стимулятори, знеболювальні |
| Розслідувальні | Виявляти приховане, просувати сюжет | UV-ліхтарик, тест-набір, комп'ютер |
| Доступу | Міняють стан світу | Відмичка, лом, джаммер, ордер |
| Сюжетні / докази | Тригери історії; власне сховище | Фото, аудіо, лист, флешка, візитка |
| Технічні | Допоміжний шар | Ремкомплекти, батарейки, рація |
| Атмосферні | Світ, рольові моменти | Кава, цигарки, щоденник, фото сім'ї |

Докази не займають слотів інвентарю й зберігаються в окремій системі (`EvidenceModule`).

### Руки та слоти

- **Ліва рука (R):** інструменти та підтримка (ліхтарик, аптечка).
- **Права рука:** бойові дії (пістолет, ніж, граната), пріоритет у бою.
- **Кишеня (F):** швидкий доступ до дрібних предметів (візитка, стимулятор); єдиний швидкий слот, якщо руки зайняті.
- Перемикання — перетягуванням у інвентарі. Майбутнє: апгрейди (кобура, підсумки) для додаткових слотів під типи предметів.

### Інвентар

15–21 слот для зброї, модулів, медикаментів і витратних; докази — окремий список без ліміту; сортування за типом (Tab). Візуалізація інвентарю — бажане покращення.

### Зброя та базові характеристики

| Предмет | Damage | Range, м | MaxDurability | Noise | Примітка |
| --- | --- | --- | --- | --- | --- |
| Пістолет | 20 | 15 | 100 | 80 | Витривалість 10% за постріл |
| Гвинтівка | 40 | 50 | 150 | 90 | Витривалість 15% за постріл |
| Ніж | 25 | 1 | 80 | 10 | Витривалість 20% за удар |
| Граната | 50 | 10 | — | 100 | Витривалість 25% |
| Димова шашка | — | — | — | 20 | Зменшує видимість |
| Глушник (модуль) | — | — | — | −50% | DurabilityCostPerUse 5; витрата витривалості −1 за постріл |
| Приціл (модуль) | — | — | — | — | Spread −30%, SpreadIncreasePerShot 2 |

У вихідній таблиці показники «витрата витривалості за постріл» задано у відсотках (10% / 15% / 20% / 25%); наступний крок — вирівняти значення з конфігураціями `WeaponConfiguration`.

### Модульна зброя та апгрейди (пропозиція)

- **Слоти:** Оптика, Дуло, Підствольний, Магазин, Ядро; 2–4 слоти залежно від типу зброї.
- **Модуль:** тип слота, тір (T1–T3), бонуси та штрафи (шум, перезарядка), вимоги. У коді: ± FireRate/Spread/Damage/Crit; типи Laser, Shield, Booster.
- **Верстак** (у хабі): перегляд дельти статів перед монтажем; апгрейд Mk I–III за кредити й ресурси.
- **Стан у коді:** `AttachModule` вже є у `MonoWeapon`, але ніде не викликається — UI та збереження модулів треба добудувати.

## 7. Розслідування, доступ, злам, руйнування

Ці чотири системи реалізують бар'єр → інструмент → нова можливість; кожна коштує ресурсів, шуму і часу.

### Розслідування

- Предмет в лівій руці (R) сканує об'єкти за радіусом і часом утримання.
- Приклади (витривалість / стрес / витрата предмета): UV-ліхтарик 3 с — 2 / +3 (якщо стрес > 50) / 2; лупа 5 с — 1 / +2 / 1; сканер 5 с — 3 / +5 / 3.
- Виявлена зачіпка додається до доказів і розблоковує варіанти в діалогах.
- **Рішення автора:** психотип не впливає на розслідування.
- **Відкрите питання:** діставати предмети будь-коли чи лише в точках інтересу (як у Condemned). Рекомендація: будь-коли, але відгук дають лише виявлювані об'єкти (`IRevealable`) у радіусі, що узгоджено з поточною реалізацією в коді.

### Доступ та злам

- Злам запускається натисканням E на об'єкті при інструменті в лівій руці; умови: Noise < 10, ворогів у конусі немає.
- **Референс — Splinter Cell: Chaos Theory:** механічний замок (відмичка, послідовність) і електронний (термінал з таймером). Відкрите питання: рівень складності мінігри.
- Час: прості замки 3 с, складні 10 с. Витривалість −5–15% за спробу, стрес +5% кожні 5 с, Noise +5.
- Провал: блокування на 30 с, Noise +15, стрес +10%, можлива тривога. Відмичка — 1 на спробу; електроніка — ліміт зарядів (наприклад, 3).

### Руйнування

| Об'єкт | Міцність | Чим руйнується | Шум | Ефект |
| --- | --- | --- | --- | --- |
| Ящик | 50 | Пістолет | 20 | Зачіпка, відволікання ворогів |
| Двері | 80 | Відмичка | 10 | Доступ |
| Стіна | 100 | Граната | 50 | Новий шлях |

Руйнування додає стрес +5–15%, витривалість −10%; руйнування цивільного майна знижує репутацію. Вплив психотипу на руйнування не вводимо, щоб не дублювати правило розділу 4. **Відкрите питання:** локальне руйнування (плитка на колонах, стіни, що осипаються, реакція ворогів на великі уламки).

### Ремонт

Автор питає, чи потрібен ремонт взагалі. Рекомендація: зберегти лише відновлення витривалості зброї (інструменти для ремонту); сюжетні ремонти (термінал) не враховуються.

## 8. Стелс та бій

Стелс — на лінії бачення і конусах огляду з таймерами реакції; провал стелсу вмикає бойовий режим.

| Ситуація | Час до виявлення |
| --- | --- |
| Стоїть у конусі огляду | 0.5–0.7 с |
| Присідає у конусі | ≈ 1.5 с |
| Рухається присідаючи поза конусом | не виявляється |

- Вбивство ззаду — зброєю ближнього бою; тіло у конусі охоронця активує тривогу (хаотичний пошук).
- Конуси та таймери налаштовуються тестами; стелс-сегменти проектуються так, щоб гравець не перебував довго на відкритому просторі (укриття, вузькі проходи).
- Шум від дій (постріл, злам, руйнування) привертає увагу ворогів (`NoiseModule`, `EntityAwarenessModule`).
- У бою впливають низьке HP, низька витривалість і високий стрес (розкид +30%); спорідненість психотипу до класу зброї — у розділі 4.
- Квести із вимогою «непоміченим» провалюються при виявленні.

## 9. Квести, репутація, економіка

### Квести

- Основні (сюжет) та побічні (від NPC); кроки лінійні або гіллясті; активація діалогом, об'єктом або входом у локацію.
- Кроки просуваються подіями `GameEventChannel`; нагорода наразі — лише докази, потрібно додати кредити, предмети, репутацію.
- Гілки залежать від психотипу та ресурсів; стелс-квести провалюються при виявленні; тихе виконання (глушник) одержує бонус.
- Радимо «Таємничий інформатор» як навчальний квест з трьома підходами: залякування, переговори, пошук доказів.

### Репутація

Система потребує переробки (позначка автора): не має стати гіміком і не має бути переускладненою. Пропозиція на базі карми RDR2:

- **Глобальна карма** від −100 до +100 з категоріями (Ненависний / Нейтральний / Шанований); змінюється діями (вбивство невинного, руйнування цивільного, наркотики — мінус; допомога — плюс).
- **Фракції** — 2–3 (наприклад, поліція, цивільні, мафія) з окремими шкалами; максимум і мінімум обмежені.
- Вплив: діалоги (більше варіантів при високій), ціни в магазинах, доступ до локацій, кінцівки («Герой» при +80, «Злодій» при −80).
- Критична низька репутація з фракцією робить гравця ворогом; відновлення можливе, але значно важче. У коді системи немає.

### Економіка

| Система | Правила | Стан |
| --- | --- | --- |
| Wallet | Кредити (GC), без ліміту; квести 10–100 GC, діалоги 5–20, продаж за 50–80% вартості | Реалізовано |
| Магазин | Без фіксованого місця: через діалоги, схованки; товари залежать від репутації, психотипу та квестів; торг знижкою; обмін предметами | Частково (покупки з діалогу — `PurchaseService`) |
| Автомати | Один асортимент на автомат, залежить від локації; аптечки 20/40 GC, кофеїн 15, адреналін 30; референс — Cyberpunk 2077 | Реалізовано через покупки |

Потрібно продумати самі предмети, щоб магазини були оправдані (що унікально купити можна лише там).

## 10. Відкриті питання, рішення, ризики та план

### Журнал рішень автора

| Тема | Рішення / позиція |
| --- | --- |
| Психотип і зброя | Спорідненість до класу замість числових штрафів |
| Психотип і розслідування | Без впливу; лише унікальні фрази |
| Психотип і техніка | Маленький перк, якщо нескладно |
| Розслідувальні і технічні предмети в діалогах | Не застосовуються |
| Ресурси | Три ресурси залишаються без змін; лише баланс-правки |
| Репутація | Карма типу RDR2; потребує редагування |
| Доступ до інвентарю / руки | Добре; додати візуалізацію, апгрейди рук/підсумків пізніше |

### Відкриті питання

- [ ] База ймовірності у діалогах: детерміновані пороги чи легкий RPG-шар навиків
- [ ] Предмети розслідування: будь-коли чи тільки в точках (Condemned)
- [ ] Злам: яка мінігра і що треба залишити з Chaos Theory
- [ ] Ремонт: чи потрібен, в якому вигляді
- [ ] Локальне руйнування і реакція ворогів
- [ ] Межі репутації: кількість фракцій і як уникнути гіміку
- [ ] Наративне навантаження дилем: скільки і якої глибини вважаємо достатнім
- [ ] Погодити ігровий цикл і скоуп вертикального зрізу (розділ 2, чернетка v1 від 19.11.2026)

### Ризики

- **Складність:** система ціни рішень, три ресурси, психотипи й репутація можуть переважити. Захід: унікальні репліки лише в ключових моментах.
- **Контент:** багато гілок діалогів — дорого; фіксуємо MVP-скоуп і шаблони.
- **Баланс:** один психотип не має бути кращим у бою.
- **Скудний арсенал** для спорідненості класів зброї.

### Етапи розробки
